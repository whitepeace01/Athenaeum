<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISBN 조회 시험</title></head>
<body style="font:14px system-ui;padding:16px"><h3>ISBN 조회 시험</h3><pre id="o">시험 중...</pre>
<script>
var isbn="9788972773207",o=document.getElementById("o"),out=[];
var T={
 "Google Books":"https://www.googleapis.com/books/v1/volumes?q=isbn:"+isbn,
 "Open Library":"https://openlibrary.org/api/books?bibkeys=ISBN:"+isbn+"&format=json&jscmd=data",
 "국립중앙도서관 서지(키 없이)":"https://www.nl.go.kr/seoji/SearchApi.do?cert_key=TEST&result_style=json&page_no=1&page_size=1&isbn="+isbn
};
Promise.all(Object.keys(T).map(function(k){
 return fetch(T[k]).then(function(r){return r.text().then(function(t){out.push(k+": 접속 허용, HTTP "+r.status+", "+t.slice(0,80).replace(/\s+/g," "))})})
 .catch(function(e){out.push(k+": 막힘 ("+e.message+")")});
})).then(function(){o.textContent=out.sort().join("\n")});
</script></body></html>
